<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线拓扑编辑器 - IT运维综合管理系统</title>
<style>
/* 壳页自包含样式（不依赖 base.html/bootstrap；仅保留编辑器必需部分） */
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; color: #212529; background: #f5f6f8; }
.topo-editor {
    height: 100vh; display: flex; flex-direction: column;
    border: 0; background: #fff;
}
.topo-editor-bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid #dee2e6;
    background: #f8f9fa; flex-wrap: wrap;
}
.topo-editor-bar input,
.topo-editor-bar select { font-size: 0.875rem; padding: 4px 8px; border: 1px solid #ced4da; border-radius: 4px; }
.topo-editor-bar button { font-size: 0.875rem; padding: 4px 10px; border: 1px solid #ced4da; border-radius: 4px; background: #fff; cursor: pointer; }
.topo-editor-bar button.btn-primary { background: #0d6efd; border-color: #0d6efd; color: #fff; }
.topo-editor-bar button:disabled { opacity: .5; cursor: not-allowed; }
.topo-editor-bar a { font-size: 0.875rem; padding: 4px 10px; border: 1px solid #ced4da; border-radius: 4px; background: #fff; color: #212529; text-decoration: none; display: inline-block; }
.topo-editor iframe { flex: 1 1 auto; width: 100%; border: 0; min-height: 0; }
#saveStatus { min-width: 120px; font-size: 0.8rem; color: #6c757d; }
.export-progress {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #dee2e6; border-top-color: #0d6efd;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 4px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.topo-import-overlay {
    position: absolute; inset: 0; z-index: 9998;
    background: rgba(255,255,255,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 40px;
}
.topo-import-overlay .spinner-border {
    width: 3rem; height: 3rem; border: 4px solid #dee2e6; border-top-color: #0d6efd;
    border-radius: 50%; animation: spin 0.8s linear infinite;
}
.topo-import-overlay h5 { color: #495057; margin: 0; }
.topo-import-overlay p { color: #6c757d; max-width: 400px; margin: 0; }
.topo-import-overlay .import-hint { font-size: 0.85rem; color: #adb5bd; max-width: 360px; }
.topo-import-overlay button { margin-top: 8px; }
.menu { position: relative; display: inline-block; }
.menu-items {
    display: none; position: absolute; right: 0; top: 100%; z-index: 9999;
    background: #fff; border: 1px solid #dee2e6; border-radius: 6px; min-width: 180px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12); padding: 4px 0;
}
.menu.open .menu-items { display: block; }
.menu-items a { display: block; padding: 6px 14px; color: #212529; text-decoration: none; font-size: 0.875rem; border: 0; background: none; text-align: left; width: 100%; cursor: pointer; }
.menu-items a:hover { background: #f1f3f5; }
.menu-divider { height: 1px; background: #e9ecef; margin: 4px 0; }
</style>
</head>
<body>
<div class="topo-editor">
    <div class="topo-editor-bar">
        <a href="/app/topologies" title="返回列表">← 返回</a>
        <input id="topoName" style="max-width:240px" placeholder="拓扑图名称 *">
        <select id="topoCustomer" style="max-width:180px"><option value="">不关联客户</option></select>
        <select id="topoRegion" style="max-width:140px"><option value="">不关联地区</option></select>
        <input id="topoDesc" style="min-width:120px; flex-grow:1" placeholder="描述（可选）">
        <select id="tplSelect" style="max-width:150px"><option value="">模板…</option></select>
        <span id="saveStatus"></span>
        <button id="btnSave" class="btn-primary" style="display:none">保存</button>
        <button id="btnImportFile" style="display:none">导入文件</button>
        <input type="file" id="importFileInput" accept=".drawio,.xml" style="display:none">
        <div class="menu" id="exportMenu">
            <button id="btnExportMenu">导出 ▾</button>
            <div class="menu-items">
                <a href="#" data-fmt="svg">SVG 矢量图</a>
                <a href="#" data-fmt="drawio">drawio 格式（Visio 可打开）</a>
                <a href="#" data-fmt="pdf">PDF 文档</a>
                <a href="#" data-fmt="vsdx">Visio (VSDX)</a>
                <div class="menu-divider"></div>
                <a href="#" data-fmt="png">PNG 图片</a>
                <div class="menu-divider"></div>
                <a href="#" id="btnRegenPdf">重新生成 PDF</a>
            </div>
        </div>
    </div>
    <iframe id="drawioFrame" allow="clipboard-read; clipboard-write"></iframe>
    <div class="topo-import-overlay" id="visioImportOverlay" style="display:none">
        <div class="spinner-border"></div>
        <h5>正在导入 Visio 文件…</h5>
        <p>drawio 正在浏览器端解析 VSDX 文件，复杂文件可能需要 30 秒以上。</p>
        <p class="import-hint" id="visioTimeoutHint" style="display:none">
            导入耗时较长，建议在 Visio 中将文件另存为 <strong>.drawio</strong> 格式后直接导入。<br>
            关闭此遮罩后可点「导入文件」按钮选择 .drawio 文件。
        </p>
        <button onclick="document.getElementById('visioImportOverlay').style.display='none'">关闭遮罩</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ====== CSRF：壳页不在 base.html 的 fetch 包装内，需自行读 cookie 加头 ======
    function getCsrfToken() {
        var m = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : '';
    }
    function postJSON(url, body) {
        return fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
            body: JSON.stringify(body)
        }).then(function(r) { return r.json(); });
    }

    // ====== 从 URL 读取参数 ======
    function qs(name) {
        var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
    }
    // 编辑 id 优先从路径取（/topologies/editor/<id>，Vue 打开方式，无 query）；
    // 导入模式 /topologies/editor/0?import=<id> 走 query（id=0 新建）
    var mPath = location.pathname.match(/\/topologies\/editor\/(\d+)$/);
    var URL_ID = mPath ? parseInt(mPath[1], 10) : parseInt(qs('id'), 10);
    var DIAGRAM_ID = isNaN(URL_ID) ? 0 : URL_ID;
    var TEMPLATE_PARAM = qs('template');
    var IMPORT_TOPO_ID = parseInt(qs('import'), 10) || null;

    var META = null;          // editor-meta 返回的数据
    var iframe = document.getElementById('drawioFrame');
    var pendingExport = null;
    var exportQueue = [];
    var exportTotal = 0;
    var exportResults = {};
    var SAVE_FLAG = '__save__';
    var visioOverlayTimer = null;

    function post(msg) { iframe.contentWindow.postMessage(JSON.stringify(msg), '*'); }
    function setStatus(text, isHtml) {
        var el = document.getElementById('saveStatus');
        if (isHtml) el.innerHTML = text; else el.textContent = text;
    }
    function showToast(msg, type) {
        setStatus(msg, false);
        console.log('[' + type + '] ' + msg);
    }

    // ====== 初始化：拉 meta 数据 → 填充表单 → 加载编辑器 ======
    fetch('/api/topologies/editor-meta?id=' + DIAGRAM_ID + '&import=' + (IMPORT_TOPO_ID || ''))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.ok) { setStatus('元数据加载失败'); return; }
            META = data;
            DIAGRAM_ID = data.diagram_id || DIAGRAM_ID;
            fillForm(data);
            initDrawioIframe(data);
        })
        .catch(function(e) { setStatus('元数据加载失败: ' + e); });

    function fillForm(data) {
        var custSel = document.getElementById('topoCustomer');
        (data.customers || []).forEach(function(c) {
            var opt = document.createElement('option');
            opt.value = c.id; opt.textContent = c.name;
            custSel.appendChild(opt);
        });
        var regSel = document.getElementById('topoRegion');
        (data.regions || []).forEach(function(r) {
            var opt = document.createElement('option');
            opt.value = r.id; opt.textContent = r.name;
            regSel.appendChild(opt);
        });
        // 权限：保存/导入按钮按 can_add/can_edit 显示
        if (data.can_add || data.can_edit) document.getElementById('btnSave').style.display = '';
        if (data.can_add) document.getElementById('btnImportFile').style.display = '';
    }

    function initDrawioIframe(data) {
        var src = '/static/vendor/drawio/index.html?embed=1&proto=json&spin=1&lang=zh&sidebar=1&math=0&test=1';
        if (data.clibs) src += '&clibs=' + encodeURIComponent(data.clibs);
        var imp = data.import;
        if (imp && imp.type === 'visio' && imp.url) src += '&url=' + encodeURIComponent(imp.url);
        iframe.src = src;
        // visio 导入遮罩
        if (imp && imp.type === 'visio') {
            document.getElementById('visioImportOverlay').style.display = '';
            visioOverlayTimer = setTimeout(function() {
                document.getElementById('visioTimeoutHint').style.display = '';
            }, 60000);
        }
    }

    // ====== drawio postMessage 通信 ======
    window.addEventListener('message', function(event) {
        var msg = event.data;
        if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch (e) { return; } }
        if (!msg || !msg.event) return;
        if (msg.event === 'init') { onDrawioReady(); }
        else if (msg.event === 'save') { doSave(msg.xml); }
        else if (msg.event === 'export') { handleExport(msg); }
    });

    function onDrawioReady() {
        try { iframe.contentWindow.Editor.useCanvasForExport = true; } catch (e) {}
        // drawio 异常诊断 + vsdx 导出启用（与旧 editor.html 一致）
        try {
            var w = iframe.contentWindow;
            var App = w.App;
            if (App && App.prototype) {
                var protos = [App.prototype, App.prototype.__proto__];
                for (var i = 0; i < protos.length; i++) {
                    if (protos[i] && protos[i].handleError) {
                        (function(proto, orig) {
                            proto.handleError = function(e) {
                                var err = (e && e.error != null) ? e.error : e;
                                console.error('[topo-err] handleError:', err && err.message,
                                    '\n堆栈:', (err && err.stack) || new Error().stack);
                                return orig.apply(this, arguments);
                            };
                        })(protos[i], protos[i].handleError);
                    }
                }
                var vsdxProto = App.prototype.__proto__;
                if (vsdxProto) vsdxProto.vsdxExportEnabled = function() { return true; };
            }
            w.onerror = function(msg2, src, line, col, err) {
                console.error('[topo-err] onerror:', msg2, '@', src + ':' + line + ':' + col,
                    err && err.stack ? '\n' + err.stack : '');
                return false;
            };
        } catch (e) { console.error('[topo-err] 诊断安装失败', e); }

        // 预填导入元数据
        var imp = META && META.import;
        if (imp && imp.name) document.getElementById('topoName').value = imp.name;
        if (imp && imp.customer_id) document.getElementById('topoCustomer').value = imp.customer_id;
        if (imp && imp.region_id) document.getElementById('topoRegion').value = imp.region_id;

        // 模板列表
        fetch('/api/topologies/templates').then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.ok) return;
                var sel = document.getElementById('tplSelect');
                data.items.forEach(function(t) {
                    var opt = document.createElement('option');
                    opt.value = t.url; opt.textContent = t.name;
                    sel.appendChild(opt);
                });
                if (TEMPLATE_PARAM) {
                    var hit = data.items.filter(function(t) {
                        return t.name === TEMPLATE_PARAM || t.file === TEMPLATE_PARAM;
                    })[0];
                    if (hit) {
                        if (!document.getElementById('topoName').value) {
                            document.getElementById('topoName').value = hit.name;
                        }
                        loadTemplateXml(hit.url, hit.name); sel.value = hit.url;
                    }
                    else showToast('模板不存在: ' + TEMPLATE_PARAM, 'danger');
                }
            }).catch(function(e) { console.warn('[tpl] 模板列表加载失败', e); });
        var tplSel = document.getElementById('tplSelect');
        if (tplSel) tplSel.addEventListener('change', function() {
            var url = this.value;
            if (!url) return;
            if (!DIAGRAM_ID && !document.getElementById('topoName').value) {
                var name = this.options[this.selectedIndex].textContent;
                document.getElementById('topoName').value = '模板-' + name;
            }
            loadTemplateXml(url, this.options[this.selectedIndex].textContent);
            this.value = '';
        });

        function loadTemplateXml(url, name) {
            fetch(url).then(function(r) { return r.text(); })
                .then(function(xml) {
                    post({action: 'load', xml: xml});
                    showToast('已加载模板「' + name + '」，保存后另存为新拓扑图', 'success');
                })
                .catch(function(e) { showToast('加载模板失败: ' + e, 'danger'); });
        }

        var imp2 = META && META.import;
        if (imp2 && imp2.type === 'visio') return;  // drawio 已从 &url= 加载
        if (imp2 && imp2.type === 'drawio' && imp2.url) {
            fetch(imp2.url).then(function(r) { return r.text(); })
                .then(function(xml) { post({action: 'load', xml: xml}); })
                .catch(function(e) { showToast('导入 .drawio 文件失败: ' + e, 'danger'); });
            return;
        }
        if (imp2 && imp2.type === 'image' && imp2.url) {
            var xml = '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/>' +
                '<mxCell id="2" value="" style="shape=image;image=' + imp2.url +
                ';imageAspect=0;opacity=70;" vertex="1" parent="1">' +
                '<mxGeometry x="0" y="0" width="800" height="600" as="geometry"/></mxCell>' +
                '</root></mxGraphModel>';
            post({action: 'load', xml: xml});
            return;
        }
        if (DIAGRAM_ID === 0) {
            var empty = '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>';
            post({action: 'load', xml: empty});
            return;
        }
        fetch('/topologies/api/diagram/' + DIAGRAM_ID).then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.ok) { showToast(data.error || '加载失败', 'danger'); return; }
                document.getElementById('topoName').value = data.name || '';
                document.getElementById('topoDesc').value = data.description || '';
                if (data.customer_id) document.getElementById('topoCustomer').value = data.customer_id;
                if (data.region_id) document.getElementById('topoRegion').value = data.region_id;
                post({action: 'load', xml: data.diagram_xml || ''});
            })
            .catch(function(e) { showToast('加载失败: ' + e, 'danger'); });
    }

    // ====== 保存 ======
    document.getElementById('btnSave').addEventListener('click', function() {
        setStatus('正在保存…');
        pendingExport = SAVE_FLAG;
        exportTotal = 0;
        post({action: 'export', format: 'xml'});
    });

    function doSave(xml) {
        var name = document.getElementById('topoName').value.trim();
        if (!name) { showToast('请输入拓扑图名称', 'warning'); setStatus(''); return; }
        var overlay = document.getElementById('visioImportOverlay');
        if (overlay) overlay.style.display = 'none';
        if (visioOverlayTimer) { clearTimeout(visioOverlayTimer); visioOverlayTimer = null; }
        postJSON('/topologies/api/diagram', {
            id: DIAGRAM_ID,
            name: name,
            description: document.getElementById('topoDesc').value,
            customer_id: parseInt(document.getElementById('topoCustomer').value) || null,
            region_id: parseInt(document.getElementById('topoRegion').value) || null,
            diagram_xml: xml
        }).then(function(data) {
            if (!data.ok) { showToast(data.error || '保存失败', 'danger'); setStatus('保存失败'); return; }
            DIAGRAM_ID = data.id;
            document.getElementById('topoName').dataset.saved = '1';
            setStatus('已保存 ' + new Date().toLocaleTimeString('zh-CN', {hour12: false}));
            exportResults = {};
            startExportQueue(['png', 'svg']);
        }).catch(function(e) { showToast('保存失败: ' + e, 'danger'); setStatus('保存失败'); });
    }

    // ====== 导出队列 ======
    function startExportQueue(formats) {
        exportQueue = formats.slice();
        exportTotal = exportQueue.length;
        updateExportStatus();
        processNextExport();
    }
    function processNextExport() {
        if (exportQueue.length === 0) {
            pendingExport = null;
            if (DIAGRAM_ID) {
                var parts = [];
                if (exportResults.png) parts.push('PNG ✓'); else if (exportResults.png === false) parts.push('PNG ✗');
                if (exportResults.svg) parts.push('SVG ✓'); else if (exportResults.svg === false) parts.push('SVG ✗');
                if (exportResults.pdf === 'ok') parts.push('PDF ✓');
                else if (exportResults.pdf) parts.push('PDF ✗');
                setStatus(parts.length ? '已保存 · ' + parts.join(' · ') : '已保存 · 导出文件已更新', true);
            }
            return;
        }
        pendingExport = exportQueue.shift();
        post({action: 'export', format: pendingExport,
              scale: pendingExport === 'png' ? 2 : 1, border: 8});
    }
    function updateExportStatus() {
        if (exportQueue.length > 0 || pendingExport) {
            var done = exportTotal - exportQueue.length - (pendingExport ? 1 : 0);
            var fmt = pendingExport || exportQueue[0] || '';
            var label = {vsdx: 'Visio', pdf: 'PDF', png: '缩略图', svg: 'SVG'}[fmt] || fmt;
            setStatus('<span class="export-progress"></span>已保存 · 生成' + label + '(' + done + '/' + exportTotal + ')', true);
        }
    }
    function handleExport(msg) {
        var fmt = msg.format;
        var data = msg.data;
        var justFinished = pendingExport;
        pendingExport = null;
        if (justFinished === SAVE_FLAG) {
            var xml = msg.xml || data;
            if (xml) doSave(xml);
            else { showToast('图内容为空，无法保存', 'warning'); setStatus('保存失败'); }
            return;
        }
        if (justFinished === 'drawio') {
            var xml2 = msg.xml || data;
            var name = (document.getElementById('topoName').value || 'topology').trim();
            downloadBlob(new Blob([xml2], {type: 'application/xml'}), name + '.drawio');
            setStatus('已导出 drawio');
            return;
        }
        if (!data) { processNextExport(); return; }
        if (justFinished && exportTotal > 0) {
            postJSON('/topologies/api/export-file', {id: DIAGRAM_ID, format: justFinished, data: data})
                .then(function(resp) {
                    if (!resp.ok) {
                        exportResults[justFinished] = false;
                        showToast(resp.error || ('导出 ' + justFinished + ' 失败'), 'danger');
                    } else {
                        exportResults[justFinished] = true;
                        if (justFinished === 'svg') {
                            if (resp.pdf === 'ok') exportResults.pdf = 'ok';
                            else if (resp.warning) { exportResults.pdf = resp.warning; showToast(resp.warning, 'warning'); }
                        }
                    }
                }).catch(function(e) {
                    exportResults[justFinished] = false;
                    showToast('导出 ' + justFinished + ' 网络错误: ' + e, 'danger');
                });
        }
        if (justFinished && exportTotal === 0) { downloadExport(data, fmt); }
        else {
            updateExportStatus();
            setTimeout(processNextExport, 300);
        }
    }

    // ====== 手动导出（下拉菜单） ======
    var exportMenu = document.getElementById('exportMenu');
    document.getElementById('btnExportMenu').addEventListener('click', function(e) {
        e.stopPropagation();
        exportMenu.classList.toggle('open');
    });
    document.addEventListener('click', function() { exportMenu.classList.remove('open'); });
    exportMenu.querySelectorAll('[data-fmt]').forEach(function(a) {
        a.addEventListener('click', function(e) {
            e.preventDefault();
            exportMenu.classList.remove('open');
            var fmt = this.dataset.fmt;
            if (fmt === 'drawio') {
                pendingExport = 'drawio'; exportTotal = 0;
                setStatus('正在导出 drawio…', true);
                post({action: 'export', format: 'xml'});
                return;
            }
            if (fmt === 'pdf' || fmt === 'vsdx') {
                setStatus('正在导出 ' + fmt.toUpperCase() + '…（由 drawio 处理）', true);
                post({action: 'invokeAction', actionName: fmt === 'pdf' ? 'exportPdf' : 'exportVsdx'});
                return;
            }
            pendingExport = fmt; exportTotal = 0;
            setStatus('正在导出 ' + fmt.toUpperCase() + '…', true);
            var opts = {action: 'export', format: fmt};
            if (fmt === 'png') opts.scale = 2;
            post(opts);
        });
    });

    // ====== 导入本地 .drawio / .xml 文件 ======
    var btnImportFile = document.getElementById('btnImportFile');
    var importFileInput = document.getElementById('importFileInput');
    if (btnImportFile && importFileInput) {
        btnImportFile.addEventListener('click', function() { importFileInput.click(); });
        importFileInput.addEventListener('change', function() {
            var file = this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                var xml = e.target.result;
                if (!xml || !xml.trim()) { showToast('文件内容为空', 'warning'); return; }
                post({action: 'load', xml: xml});
                showToast('已导入 ' + file.name, 'success');
                if (!DIAGRAM_ID && !document.getElementById('topoName').value) {
                    document.getElementById('topoName').value = file.name.replace(/\.(drawio|xml)$/i, '');
                }
            };
            reader.onerror = function() { showToast('读取文件失败', 'danger'); };
            reader.readAsText(file);
            this.value = '';
        });
    }

    // ====== 重新生成 PDF ======
    document.getElementById('btnRegenPdf').addEventListener('click', function(e) {
        e.preventDefault();
        exportMenu.classList.remove('open');
        if (!DIAGRAM_ID) { showToast('请先保存拓扑图', 'warning'); return; }
        setStatus('正在重新生成 PDF…', true);
        postJSON('/topologies/api/regenerate-pdf/' + DIAGRAM_ID, {})
            .then(function(resp) {
                if (resp.ok) { showToast('PDF 已重新生成', 'success'); setStatus('PDF 已生成'); }
                else { showToast(resp.error || 'PDF 生成失败', 'danger'); setStatus('PDF 生成失败'); }
            }).catch(function(e) {
                showToast('请求失败: ' + e, 'danger'); setStatus('PDF 生成失败');
            });
    });

    function downloadExport(data, fmt) {
        var name = (document.getElementById('topoName').value || 'topology').trim();
        if (fmt === 'svg') {
            downloadBlob(new Blob([data], {type: 'image/svg+xml'}), name + '.svg');
        } else {
            var a = document.createElement('a');
            a.href = data;
            a.download = name + '.' + fmt;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }
    function downloadBlob(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }
})();
</script>
</body>
</html>

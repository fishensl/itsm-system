name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# vue-dist Release 发布需要 contents: write（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Published migrations are immutable
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_migration_immutability.py

      - name: Ruff (pyflakes)
        run: ruff check .

      - name: Frontend status catalog is current
        run: python scripts/generate_frontend_status.py --check

      - name: Pytest
        run: pytest

      - name: pip-audit (依赖漏洞扫描，仅告警不阻断)
        continue-on-error: true
        run: pip-audit --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # master push 时按 commit SHA 发布不可变 dist（update.sh 按后端 HEAD 精确拉取）
      - name: Publish dist (master only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          cd dist
          zip -r ../itsm-vue-dist.zip .
          cd ..
          sha256sum itsm-vue-dist.zip | awk '{print $1}' > itsm-vue-dist.zip.sha256
          RELEASE_TAG="vue-dist-${GITHUB_SHA}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在；拒绝覆盖不可变产物" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" itsm-vue-dist.zip itsm-vue-dist.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Vue 前端构建产物 ${GITHUB_SHA}" \
            --notes "由 CI 从 commit ${GITHUB_SHA} 构建；产物不可覆盖。"
        env:
          GH_TOKEN: ${{ github.token }}

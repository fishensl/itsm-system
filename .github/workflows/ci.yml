name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# vue-dist Release 发布需要 contents: write（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff (pyflakes)
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: pip-audit (依赖漏洞扫描，仅告警不阻断)
        continue-on-error: true
        run: pip-audit --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # master push 时发布 dist 到 GitHub Release（update.sh 拉取部署，服务器免 Node）
      - name: Publish dist (master only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          cd dist
          zip -r ../itsm-vue-dist.zip .
          cd ..
          gh release upload vue-dist itsm-vue-dist.zip --clobber \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || \
            gh release create vue-dist itsm-vue-dist.zip --repo "$GITHUB_REPOSITORY" \
              --title "Vue 前端构建产物" --notes "由 CI 自动构建（master push）"
        env:
          GH_TOKEN: ${{ github.token }}
